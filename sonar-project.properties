
sonar.organization=megnedouguy-blaise
sonar.projectKey=MEGNEDOUGUY-BLAISE_system_metrics_agent
sonar.projectName=system_metrics_agent

# Tout le dépôt est analysé (code, Dockerfiles, workflow), sauf les tests
sonar.sources=.
sonar.exclusions=app/tests/**,requirements*.txt
sonar.tests=app/tests
sonar.test.inclusions=app/tests/**

sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml

# Le scanner attend le verdict de la Quality Gate : s'il est négatif, le job échoue
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300